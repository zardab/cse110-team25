<!-- Intro / 3D Canvas / Scene Container -->
<div id="container"></div>

<!-- Main Game UI (hidden until the intro scene calls back) -->
<div id="app" style="display: none;">
  <header class="top-nav">
    <button id="menu-btn" class="icon-btn" aria-label="Menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>

    <div id="progress-dots" class="progress-dots"></div>

    <div class="top-nav-right">
      <div id="timer-display" class="timer-display">15s</div>
      <button id="reset-btn" class="icon-btn" title="Reset Level" aria-label="Reset">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
        </svg>
      </button>
      <button id="help-btn" class="icon-btn" title="Help" aria-label="Help">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
      </button>
    </div>
  </header>

  <main class="board-card">
    <div class="card-badges">
      <div class="badge level-badge">Level 1 <span class="dim">/ 12</span></div>
      <div class="badge attempt-badge">Attempt 1</div>
    </div>
    <div id="konva-container" class="konva-container"></div>
      <div id="game-over-overlay" class="game-over-overlay" hidden>
       <div class="game-over-card">
       <h1 id="game-over-title">Game Over</h1>
       <p id="game-over-message"></p>
       <button id="restart-minigame-btn" type="button">
        Play Again
     </button>
   </div>
 </div>
   </main>

  <footer class="gate-tray-section">
    <div class="tray-header">
      <span class="tray-title">AVAILABLE GATES</span>
      <span class="tray-subtitle">CLICK ⓘ TO LEARN MORE</span>
    </div>
    <div id="palette-grid" class="palette-grid"></div>
  </footer>
</div>

<script type="module" src="/src/main.ts"></script>
