<!-- Intro / 3D Canvas / Scene Container -->
<div id="container"></div>

<!-- Main Game UI (hidden until the intro scene calls back) -->
<div id="app" style="display: none;">
  <header class="top-nav">
    <button id="menu-btn" class="icon-btn" aria-label="Menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>

    <div id="progress-dots" class="progress-dots"></div>

    <div class="top-nav-right">
      <div id="timer-display" class="timer-display">15s</div>

      <button id="undo-btn" class="icon-btn" title="Undo" aria-label="Undo" disabled>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 14 4 9l5-5"/>
          <path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>
        </svg>
      </button>
      <button id="reset-btn" class="icon-btn" title="Reset Level" aria-label="Reset">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
        </svg>
      </button>
      <button id="help-btn" class="icon-btn" title="Help" aria-label="Help">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
      </button>
    </div>
  </header>

  <main class="board-card">
    <div class="card-badges">
      <div class="badge level-badge" id="level-title"></div>
      <!-- <div class="badge attempt-badge">Attempt 1</div> --> <!--- Only for HARD mode -->
    </div>
    <div id="konva-container" class="konva-container"></div>
      <div id="game-over-overlay" class="game-over-overlay" hidden>
       <div class="game-over-card">
       <h1 id="game-over-title">Game Over</h1>
       <p id="game-over-message"></p>
       <button id="restart-minigame-btn" type="button">
        Play Again
     </button>
   </div>
 </div>
   </main>

  <footer class="gate-tray-section">
    <div class="tray-header">
      <span class="tray-title">AVAILABLE GATES</span>
      <span class="tray-subtitle">CLICK ⓘ TO LEARN MORE</span>
    </div>
    <div id="palette-grid" class="palette-grid"></div>
  </footer>

  <div id="game-sidebar" class="game-sidebar" hidden>
    <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>
    <aside class="sidebar-panel" role="dialog" aria-modal="true" aria-label="Game menu">
      <button id="sidebar-close-btn" class="sidebar-close-btn" type="button" aria-label="Close menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <nav class="sidebar-nav">
        <button type="button" class="sidebar-nav-btn">Tutorial</button>
        <button type="button" class="sidebar-nav-btn">Restart</button>
        <button type="button" class="sidebar-nav-btn">Mini-Games</button>

        <div class="sidebar-difficulty-row">
          <span class="sidebar-difficulty-label">Difficulty</span>
          <button
            id="difficulty-toggle"
            class="difficulty-toggle"
            type="button"
            data-mode="EASY"
            aria-label="Toggle difficulty"
          >
            <span class="difficulty-toggle-thumb" aria-hidden="true"></span>
            <span class="difficulty-option" data-value="EASY">EASY</span>
            <span class="difficulty-option" data-value="HARD">HARD</span>
          </button>
        </div>
      </nav>

      <!-- TODO: replace hardcoded Level 5 / 12 with real level progress -->
      <div class="sidebar-footer">
        Level 5 <span class="dim">/ 12</span>
      </div>
    </aside>
  </div>
</div>

<script type="module" src="/src/main.ts"></script>
